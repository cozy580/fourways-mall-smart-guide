<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fourways Mall Guide · Entrance QR Poster</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#e9ece7;color:#192523;font-family:Arial,sans-serif}.poster{width:210mm;min-height:297mm;margin:18px auto;background:#f7f6f2;padding:28mm 22mm;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;overflow:hidden}.eyebrow{font-size:11px;font-weight:bold;letter-spacing:3px;color:#174e43;text-transform:uppercase;margin:0 0 18px}.mark{width:48px;height:48px;border-radius:15px;background:#174e43;color:#d9ef90;display:grid;place-items:center;font-size:25px;font-weight:bold;margin-bottom:20px}h1{font-size:43px;line-height:1.12;letter-spacing:-1.5px;max-width:570px;margin:0 0 18px}p{font-size:17px;line-height:1.6;color:#64716d;max-width:470px;margin:0}.qr{width:88mm;height:88mm;object-fit:contain;background:white;border:10px solid white;border-radius:12px;margin:36px auto 24px}.cta{font-size:14px;font-weight:bold;color:#174e43;margin-bottom:8px}.url{font-size:11px;color:#7b8780;overflow-wrap:anywhere}.bottom{margin-top:auto;padding-top:28px;font-size:10px;color:#7b8780;border-top:1px solid #e1e5de;width:100%}.bottom strong{color:#192523}@media print{@page{size:A4;margin:0}body{background:white}.poster{margin:0;width:210mm;height:297mm;min-height:297mm;page-break-after:avoid}}
  </style>
</head>
<body>
  <main class="poster">
    <div class="mark" aria-hidden="true">4</div>
    <p class="eyebrow">Fourways Mall visitor guide</p>
    <h1>Your visit,<br>made easier.</h1>
    <p>Scan to search stores and find the unit numbers published by Fourways Mall.</p>
    <img class="qr" src="./assets/fourways-mall-guide-qr.png" alt="QR code linking to the Fourways Mall visitor guide">
    <p class="cta">Open the store directory</p>
    <p class="url">cozy580.github.io/fourways-mall-smart-guide</p>
    <div class="bottom"><strong>Fourways Mall Guide</strong> · Store details sourced from Fourways Mall’s public directory</div>
  </main>
</body>
</html>
